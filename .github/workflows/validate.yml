name: Validate

# Read-only validation. This workflow never writes to the repository: it runs the
# repository's own generators and validators and fails if committed outputs are
# stale or a check does not pass.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-ci.txt

      # --- Generated outputs must match what the generators produce ----------
      # The generator stamps the current date into its output, so the freshness
      # check ignores that one line (-I) and fails on any real content drift.
      - name: Prompt index is current
        run: |
          python3 scripts/generate_prompt_index.py
          git diff --exit-code \
            -I'"generated"' \
            -I'^\*\*Generated:\*\*' \
            -- PROMPT_INDEX.json PROMPT_INDEX.md

      - name: Agentic inventory counts are current
        run: python3 domain-agentic-resources/inventory_counts.py --check

      # Canonical repository facts, plus every count published in a primary
      # document. Fails on a missing generated block, a missing declaration, a
      # stale value, or a hand-edited block — a missing match is never a pass.
      - name: Repository facts and published counts are current
        run: python3 scripts/generate_repo_facts.py --check

      # --- PAE Registry -------------------------------------------------------
      # Identity is public API. This step fails if a UID or birth path changed,
      # if a public ID changed without a retired alias, if a ledger row vanished,
      # if a UID/public-ID/alias collides, if the ledger and the records are not
      # bijective, if any record or ledger row violates its schema, or if a
      # generated artifact was hand-edited or left stale.
      - name: Registry identity, schemas and generated artifacts
        run: python3 scripts/generate_registry.py --check

      - name: Registry unit tests
        working-directory: scripts
        run: python3 -m unittest discover -s pae_registry/tests -t . -v

      # --- Catalog / metadata integrity --------------------------------------
      - name: Technique index integrity
        working-directory: techniques
        run: python3 audit_technique_index.py

      - name: Technique catalog claims match reality
        run: python3 scripts/validate_technique_catalog.py

      - name: Command frontmatter
        run: python3 domain-agentic-resources/commands/validate_command_frontmatter.py

      - name: Naming conventions
        run: python3 scripts/validate_naming_conventions.py --ci

      # --- Content integrity --------------------------------------------------
      - name: Relative Markdown links resolve
        run: python3 scripts/check_relative_links.py

      # Frontmatter cross-references (related_prompts and siblings), which the
      # body-link checker never inspects. Existing debt is baselined in
      # meta/xref_baseline.json; this fails only on NEW unresolved references.
      - name: Frontmatter cross-references (ratchet)
        run: python3 scripts/check_frontmatter_references.py --check

      # Self-contained bundles carry copies of canonical prompts on purpose.
      # This fails when an original was edited and its copies were not.
      - name: Vendored copies match their canonicals
        run: python3 scripts/check_vendored_copies.py

      # Every reference to a moved or removed file must point at its new home.
      - name: Reorg map fully applied
        run: python3 scripts/apply_reorg_map.py --check

      - name: Shell script syntax
        run: |
          status=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || { echo "syntax error: $f"; status=1; }
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit "$status"

      - name: Python syntax
        run: |
          status=0
          while IFS= read -r -d '' f; do
            python3 -m py_compile "$f" || { echo "syntax error: $f"; status=1; }
          done < <(find . -name '*.py' -not -path './.git/*' -print0)
          exit "$status"

  toolkit-tests:
    name: Self-contained toolkit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: continuity-kit unit tests
        working-directory: continuity-kit
        run: python3 -m unittest discover -s tests -v

      - name: ai-investment-research-toolkit tests
        working-directory: ai-investment-research-toolkit
        run: python3 -m unittest discover -s tests -v
