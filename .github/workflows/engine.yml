name: Engine

# The installable PAE Engine: unit tests, packaging, and a fresh-wheel install
# driven from outside the repository.
#
# Registry and generator changes trigger this too. The Engine's whole resource
# contract is meta/registry/, so a change there can break the runtime without
# touching a line of pae-engine/.

on:
  push:
    branches: [main]
    paths:
      - 'pae-engine/**'
      - 'meta/registry/**'
      - 'scripts/pae_registry/**'
      - 'scripts/generate_registry.py'
      - 'LICENSE'
      - '.github/workflows/engine.yml'
  pull_request:
    branches: [main]
    paths:
      - 'pae-engine/**'
      - 'meta/registry/**'
      - 'scripts/pae_registry/**'
      - 'scripts/generate_registry.py'
      - 'LICENSE'
      - '.github/workflows/engine.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Engine unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the current default. A package that claims
        # >=3.10 and is only ever run on 3.12 is claiming something untested.
        python-version: ['3.10', '3.12']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately no `pip install` of anything: the Engine declares zero
      # runtime dependencies, and the suite must pass without a package index.
      # Prints the authoritative search/routing metric table into the build log
      # alongside the two rejected ranking baselines, so a regression is
      # visible as a number and not only as a failed assertion. The floors
      # themselves are asserted in tests/test_search_regression.py.
      #
      # These numbers come from an internal tuning and regression set. They are
      # not an independently authored benchmark and must not be published as
      # evidence of general search quality.
      - name: Search and routing diagnostics
        working-directory: pae-engine
        env:
          PYTHONPATH: src:tests
        run: |
          python3 tests/run_search_routing_diagnostics.py \
            --repo "$GITHUB_WORKSPACE" --compare

      # tests/run_context_compiler_diagnostics.py is deliberately NOT a build
      # step. Search diagnostics are metadata-only and finish in seconds;
      # packing diagnostics read bodies, and Registry resolves each reference
      # by scanning the whole 9.7 MB registry file, so even a 25-case sweep is
      # ~30 GB of re-reading — 29 s on a warm local disk, over 14 minutes on a
      # runner. The invariants it asserts (no guarded body shortened, no bundle
      # over the budget it reported, top-hit retention, determinism) are
      # covered against the live registry by tests/test_context_regression.py
      # below. The full sweep stays a local command.
      - name: Unit tests
        working-directory: pae-engine
        env:
          PYTHONPATH: src:tests
        run: python3 -m unittest discover -s tests -t tests -v

  package:
    name: Build, install and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # build and twine are CI tooling, never package dependencies.
      - name: Install build tooling
        run: python3 -m pip install --disable-pip-version-check build twine

      - name: Build wheel and sdist
        working-directory: pae-engine
        run: python3 -m build

      - name: twine check
        working-directory: pae-engine
        run: python3 -m twine check dist/*

      - name: Engine licence matches the repository licence
        run: |
          if ! cmp -s LICENSE pae-engine/LICENSE; then
            echo "::error::pae-engine/LICENSE has drifted from the repository LICENSE"
            diff -u LICENSE pae-engine/LICENSE || true
            exit 1
          fi

      - name: Licence ships in both artifacts
        working-directory: pae-engine
        run: |
          status=0
          unzip -l dist/*.whl | grep -q 'LICENSE' \
            || { echo "::error::wheel does not contain LICENSE"; status=1; }
          tar -tzf dist/*.tar.gz | grep -q 'LICENSE' \
            || { echo "::error::sdist does not contain LICENSE"; status=1; }
          exit "$status"

      - name: No corpus or registry is packaged
        working-directory: pae-engine
        run: |
          status=0
          if unzip -l dist/*.whl | grep -Eq 'registry\.jsonl|registry-summary\.json'; then
            echo "::error::registry data must not be bundled in the wheel"; status=1
          fi
          if tar -tzf dist/*.tar.gz | grep -Eq 'registry\.jsonl|registry-summary\.json'; then
            echo "::error::registry data must not be bundled in the sdist"; status=1
          fi
          exit "$status"

      - name: Install the built wheel into a clean environment
        run: |
          python3 -m venv /tmp/pae-smoke
          /tmp/pae-smoke/bin/pip install --disable-pip-version-check \
            pae-engine/dist/*.whl

      # Phase 6 changed the shape of this assertion, not its intent. Declaring
      # an optional extra necessarily emits conditional metadata:
      #
      #   Provides-Extra: mcp
      #   Requires-Dist: mcp<3,>=2.1.1; extra == "mcp"
      #
      # so "Requires-Dist must be empty" is no longer the right test. The
      # guarantee that actually matters is unchanged, and is what is checked
      # here: a base install resolves to nothing but the standard library.
      - name: Base install has zero unconditional dependencies
        run: |
          /tmp/pae-smoke/bin/pip check
          extra=$(/tmp/pae-smoke/bin/pip list --format=freeze \
            | grep -Ev '^(pip|setuptools|wheel|prompt-agent-engineering)==' || true)
          if [ -n "$extra" ]; then
            echo "::error::the base install pulled in runtime dependencies:"
            echo "$extra"
            exit 1
          fi
          /tmp/pae-smoke/bin/python - <<'PYCHECK'
          import importlib.metadata as md
          requires = md.distribution("prompt-agent-engineering").requires or []
          unconditional = [r for r in requires if "extra ==" not in r]
          assert not unconditional, f"unconditional Requires-Dist: {unconditional}"
          foreign = [r for r in requires if 'extra == "mcp"' not in r]
          assert not foreign, f"only the mcp extra may declare requirements: {foreign}"
          named = [r.split(";")[0].strip() for r in requires]
          assert all(n.startswith("mcp") for n in named), named
          print(f"conditional Requires-Dist only: {requires}")
          PYCHECK

      # The SDK must not arrive with a base install, and `pae mcp` must fail
      # like a usage error rather than a traceback about a third-party package
      # the user never asked for.
      - name: Base install carries no MCP SDK
        run: |
          if /tmp/pae-smoke/bin/python -c "import mcp" 2>/dev/null; then
            echo "::error::the MCP SDK is importable from a base install"
            exit 1
          fi
          /tmp/pae-smoke/bin/pae mcp --help > /dev/null
          set +e
          out=$(/tmp/pae-smoke/bin/pae mcp --repo "$GITHUB_WORKSPACE" 2>&1 1>/dev/null)
          code=$?
          set -e
          if [ "$code" != "2" ]; then
            echo "::error::expected exit 2 from 'pae mcp' without the extra, got $code"
            exit 1
          fi
          case "$out" in
            *missing_extra*) echo "missing extra reported cleanly: $out" ;;
            *) echo "::error::unexpected stderr: $out"; exit 1 ;;
          esac

      # Run from outside the checkout, against the checkout, using the console
      # script. This is the only step that would catch a missing entry point.
      - name: Installed-package smoke tests
        run: |
          /tmp/pae-smoke/bin/python pae-engine/tests/smoke_install.py \
            --repo "$GITHUB_WORKSPACE" \
            --pae /tmp/pae-smoke/bin/pae

      - name: Committed registry passes consumer validation
        run: |
          /tmp/pae-smoke/bin/pae validate-registry \
            --repo "$GITHUB_WORKSPACE" --verify-checksums

  # The MCP adapter, exercised with the optional extra actually installed.
  #
  # Deliberately a separate job from `unit`: that one proves the package works
  # with no dependencies at all, and installing the SDK into it would destroy
  # the only environment where that claim is testable.
  mcp:
    name: MCP adapter (py${{ matrix.python-version }}, mcp ${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # A real 2x2. `sdk` is declared as a matrix dimension rather than left
        # to `include` alone, because include entries that introduce only new
        # keys are merged into every combination - which would quietly collapse
        # this to a single SDK version and test half of what it claims to.
        #
        # The floor and the newest compatible release resolve to the same
        # version today; the matrix exists so the day they diverge is the day
        # CI says so, rather than a user.
        python-version: ['3.10', '3.12']
        sdk: [floor, latest]
        include:
          - sdk: floor
            sdk-spec: 'mcp==2.1.1'
          - sdk: latest
            sdk-spec: 'mcp>=2.1.1,<3'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      # Plain `mcp`, never `mcp[cli]`. The cli extra pulls typer/rich for the
      # MCP Inspector; it is a developer convenience and not a PAE dependency.
      - name: Install the MCP SDK
        run: |
          python3 -m pip install --disable-pip-version-check "${{ matrix.sdk-spec }}"
          python3 -c "
          import importlib.metadata as md
          print('resolved mcp', md.version('mcp'))
          "

      - name: Adapter, client, stdio and catalog tests
        working-directory: pae-engine
        env:
          PYTHONPATH: src:tests
        run: python3 -m unittest discover -s tests -t tests -v

      - name: Installed wheel resolves the extra and serves
        run: |
          python3 -m pip install --disable-pip-version-check build
          (cd pae-engine && python3 -m build --wheel)
          python3 -m venv /tmp/pae-mcp
          whl=$(ls pae-engine/dist/*.whl | head -1)
          /tmp/pae-mcp/bin/pip install --disable-pip-version-check "${whl}[mcp]"
          /tmp/pae-mcp/bin/pip check
          /tmp/pae-mcp/bin/python -c "import mcp; print('sdk present')"
          /tmp/pae-mcp/bin/pae --version
